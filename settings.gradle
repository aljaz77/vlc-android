pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id("com.android.settings") version '9.1.1'
}

def vlcMajorVersion = hasProperty('forceVlc4') && getProperty('forceVlc4') ? 4 : 3

android {
    minSdk = vlcMajorVersion == 3 ? 17 : 23
    targetSdk = 36
    compileSdk = 36 // Dockers: 3.0=36 / 4.0=36
    buildToolsVersion = '36.0.0'
}

// The libvlcjni sources live in a separate VideoLAN repository and are only
// needed by the 'dev' flavour, which compiles libVLC from source with the NDK.
// The debug/release flavours resolve libvlc + medialibrary from Maven instead,
// so only include these projects when their sources are actually checked out.
// ':medialibrary' itself depends on ':libvlcjni:libvlc', so both stand or fall together.
if (file('libvlcjni/libvlc').exists()) {
    include ':libvlcjni:libvlc'
    include ':medialibrary'
}
include ':application:tools', ':application:resources', ':application:mediadb', ':application:app', ':application:live-plot-graph', ':application:television', ':application:donations', ':application:remote-access-server'
include ':application:vlc-android'
include ':application:moviepedia'
include ':application:remote-access-client'
